# Render Blueprint for the backend API. See docs/deployment-render.md.
# Secrets are never written here: `sync: false` values are entered in the Render dashboard.
services:
  - type: web
    name: geoclime-api
    runtime: node
    # Only server/ is built, and only commits touching server/ trigger a deploy.
    rootDir: server
    # Match this to the Aiven service's cloud region to keep database round-trips short.
    region: frankfurt
    plan: free
    # Dev dependencies are needed at runtime: everything runs through tsx (standard section 2).
    # A deploy is blocked unless the typecheck and tests pass.
    buildCommand: npm ci --include=dev && npm run typecheck && npm test
    # Pending migrations are applied before the API starts accepting traffic.
    startCommand: npm run migration:run && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Upload the Aiven CA certificate as a Secret File named aiven-ca.pem.
      - key: DATABASE_SSL_CA
        value: /etc/secrets/aiven-ca.pem
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Optional: makes the first verified sign-in with this email the administrator (Phase 2).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Cloudinary for flood-report media: cloudinary://<api_key>:<api_secret>@<cloud_name>, set in the dashboard.
      - key: CLOUDINARY_URL
        sync: false
      # Notifications (docs/notifications.md, docs/email.md). Secrets: set in the dashboard.
      - key: APP_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FALLBACK
        value: "true"
      - key: EMAIL_FROM_NAME
        value: GeoClime Intelligence
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_MAX_PER_TICK
        value: "30"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_APPS_SCRIPT_URL
        sync: false
      - key: EMAIL_APPS_SCRIPT_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Render puts one proxy in front of the service; the public routes' rate limit needs the client IP.
      - key: TRUST_PROXY_HOPS
        value: "1"
