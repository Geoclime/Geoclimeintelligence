<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Climate intelligence and disaster management for Rivers State, Nigeria." />
    <meta name="theme-color" content="#063C3E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GeoClime Intelligence</title>
    <script>
      // Apply the saved theme before first paint, so dark-mode users never see a white flash.
      // ThemeContext takes over once React loads; the key must match THEME_STORAGE_KEY there.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("geoclime:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>GeoClime Intelligence needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
