<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Climate intelligence and disaster management for Nigeria: places, infrastructure and rainfall on one shared, sourced map." />
    <meta name="theme-color" content="#063C3E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable app (PWA): public/manifest.webmanifest and public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeoClime" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inter is the design font (--font-sans). If it can't load, the system UI font is used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
    <title>GeoClime Intelligence</title>
    <script>
      // Apply the saved theme before first paint, so dark-mode users never see a white flash.
      // ThemeContext takes over once React loads; the key must match THEME_STORAGE_KEY there.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("geoclime:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>GeoClime Intelligence needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
